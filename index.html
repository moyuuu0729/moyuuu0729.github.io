<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>簡單停車遊戲</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #e0f7fa;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  #gameArea {
    position: relative;
    width: 400px;
    height: 200px;
    background: #a7d7f9;
    border: 2px solid #2196f3;
    margin-top: 20px;
  }
  #parkingSpot {
    position: absolute;
    bottom: 20px;
    left: 150px;
    width: 100px;
    height: 60px;
    background: #81c784;
    border: 2px dashed #388e3c;
    border-radius: 8px;
  }
  #car {
    position: absolute;
    bottom: 30px;
    left: 10px;
    width: 60px;
    height: 30px;
    background: #f44336;
    border-radius: 8px 8px 4px 4px;
  }
  #message {
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
  }
</style>
</head>
<body>

<h1>簡單停車遊戲</h1>
<p>用 ← → 鍵控制車子左右移動，按空白鍵停車。</p>

<div id="gameArea">
  <div id="parkingSpot"></div>
  <div id="car"></div>
</div>

<div id="message"></div>

<script>
  const car = document.getElementById('car');
  const parkingSpot = document.getElementById('parkingSpot');
  const message = document.getElementById('message');

  // 車子水平位置 (left) 的起始數值（以 px 計）
  let carPos = 10;
  const moveStep = 10; // 每次移動距離
  const gameAreaWidth = 400;
  const carWidth = 60;

  // 監聽鍵盤事件
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') {
      carPos = Math.max(0, carPos - moveStep);
      updateCarPosition();
      message.textContent = ''; // 按鍵時清除訊息
    } else if (e.key === 'ArrowRight') {
      carPos = Math.min(gameAreaWidth - carWidth, carPos + moveStep);
      updateCarPosition();
      message.textContent = '';
    } else if (e.key === ' ') {
      e.preventDefault();
      checkParking();
    }
  });

  function updateCarPosition() {
    car.style.left = carPos + 'px';
  }

  function checkParking() {
    const parkingLeft = parkingSpot.offsetLeft;
    const parkingRight = parkingLeft + parkingSpot.offsetWidth;
    const carLeft = carPos;
    const carRight = carLeft + carWidth;

    if (carLeft >= parkingLeft && carRight <= parkingRight) {
      message.style.color = 'green';
      message.textContent = '恭喜！成功停車！🚗✅';
    } else {
      message.style.color = 'red';
      message.textContent = '未停好喔，請再嘗試！';
    }
  }

  // 初始化車子位置
  updateCarPosition();
</script>

</body>
</html>
