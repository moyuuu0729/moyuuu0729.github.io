<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>進階列車調度盤遊戲Demo（含開始按鈕）</title>
<style>
  body {
    margin: 0; padding: 0;
    background: #1a1a1a;
    color: #eee;
    font-family: "Microsoft JhengHei", Arial, sans-serif;
    user-select: none;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h2 {
    margin: 15px 0 5px;
  }
  #gameCanvas {
    background: #222;
    border-radius: 12px;
    border: 3px solid #555;
    margin-bottom: 10px;
    display: block;
    max-width: 100vw;
    width: 700px;
    height: 450px;
  }
  #controlPanel {
    width: 700px;
    max-width: 100vw;
    padding: 10px 15px;
    background: #292929;
    border-radius: 12px;
    box-sizing: border-box;
  }
  #switchButtons {
    margin-bottom: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .switchBtn {
    flex: 1 1 45%;
    background: #2196f3;
    border: none;
    border-radius: 8px;
    padding: 12px 0;
    color: white;
    font-size: 18px;
    cursor: pointer;
    user-select: none;
    transition: background-color 0.25s ease;
  }
  .switchBtn.active {
    background: #f9a825;
    color: #222;
  }
  .switchBtn:active {
    background: #1769aa;
  }
  #status {
    background: #111;
    padding: 10px;
    border-radius: 8px;
    min-height: 40px;
    max-height: 100px;
    overflow-y: auto;
    font-size: 16px;
    line-height: 1.3;
    font-family: Consolas, monospace;
    color: #e0e0e0;
  }
  #startButton {
    margin: 15px 0;
    padding: 16px 30px;
    font-size: 24px;
    border-radius: 12px;
    border: none;
    background-color: #4caf50;
    color: white;
    cursor: pointer;
    user-select: none;
    transition: background-color 0.3s ease;
  }
  #startButton:hover {
    background-color: #388e3c;
  }
  @media (max-width: 720px) {
    #gameCanvas, #controlPanel {
      width: 95vw;
    }
    .switchBtn {
      flex: 1 1 100%;
    }
  }
</style>
</head>
<body>

<h2>進階列車調度盤遊戲 Demo</h2>
<canvas id="gameCanvas" width="700" height="450"></canvas>

<button id="startButton" aria-label="開始遊戲">開始遊戲</button>

<div id="controlPanel" role="region" aria-label="分岔點控制面板" hidden>
  <div id="switchButtons">
  </div>
  <div id="status" aria-live="polite" aria-atomic="true">請按下開始遊戲按鈕啟動遊戲。</div>
</div>

<script>
(() => {
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const switchButtonsDiv = document.getElementById("switchButtons");
  const statusDiv = document.getElementById("status");
  const controlPanel = document.getElementById("controlPanel");
  const startButton = document.getElementById("startButton");

  const W = canvas.width;
  const H = canvas.height;

  const nodes = {
    A: { x: 80, y: 80 },
    B: { x: 620, y: 80 },
    C: { x: 350, y: 150 },
    D: { x: 80, y: 370 },
    E: { x: 620, y: 370 },
    F: { x: 350, y: 300 },
    G: { x: 350, y: 370 }
  };
  const stations = ["A", "B", "D", "E", "G"];

  const switches = {
    X1: {
      position: nodes.C,
      states: [
        { name: "向B", nextNode: "B" },
        { name: "向F", nextNode: "F" }
      ],
      currentStateIndex: 0
    },
    X2: {
      position: nodes.F,
      states: [
        { name: "向E", nextNode: "E" },
        { name: "向G", nextNode: "G" }
      ],
      currentStateIndex: 0
    }
  };

  const tracks = [
    ["A", "B"],
    ["A", "D"],
    ["D", "G"],
    ["B", "E"],
    ["B", "C"],
    ["C", "F"],
    ["F", "E"],
    ["F", "G"],
  ];

  // 遊戲狀態控制
  let gameRunning = false;
  let globalFrameCount = 0;

  // 列車類別
  class Train {
    constructor(id, color, startNode, speed = 1, stopTime = 80) {
      this.id = id;
      this.color = color;
      this.currentNode = startNode;
      this.nextNode = getNextNode(startNode);
      this.speed = speed;
      this.progress = 0;
      this.pos = { x: nodes[startNode].x, y: nodes[startNode].y };
      this.stopTimer = 0;
      this.stopTime = stopTime;
      this.state = "stopped";
    }
    update() {
      if (this.state === "stopped") {
        this.stopTimer++;
        if (this.stopTimer >= this.stopTime) {
          this.state = "moving";
          this.stopTimer = 0;
          this.nextNode = getNextNode(this.currentNode);
        }
        return;
      }
      if (!this.nextNode) {
        this.state = "stopped";
        return;
      }
      this.progress += 0.01 * this.speed;
      if (this.progress >= 1) {
        this.currentNode = this.nextNode;
        this.pos = { ...nodes[this.currentNode] };
        this.progress = 0;
        this.state = "stopped";
      } else {
        let from = nodes[this.currentNode];
        let to = nodes[this.nextNode];
        this.pos.x = from.x + (to.x - from.x) * this.progress;
        this.pos.y = from.y + (to.y - from.y) * this.progress;
      }
    }
    draw(ctx) {
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.pos.x, this.pos.y, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(this.pos.x + 12, this.pos.y - 8, 12, 16);
      ctx.fillStyle = "#222";
      ctx.font = "bold 14px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(this.id, this.pos.x, this.pos.y);
    }
  }

  const trains = [
    new Train("1", "#e53935", "A", 1.2, 120),
    new Train("2", "#43a047", "D", 1.0, 100),
    new Train("3", "#1e88e5", "B", 1.1, 90)
  ];

  const schedule = [
    { trainId: "1", startFrame: 0 },
    { trainId: "2", startFrame: 300 },
    { trainId: "3", startFrame: 600 }
  ];

  function getNextNode(currentNode) {
    if (currentNode === "C") {
      return switches.X1.states[switches.X1.currentStateIndex].nextNode;
    } else if (currentNode === "F") {
      return switches.X2.states[switches.X2.currentStateIndex].nextNode;
    }
    for (let track of tracks) {
      if (track[0] === currentNode) return track[1];
    }
    return null;
  }

  function toggleSwitch(switchId) {
    switches[switchId].currentStateIndex =
      (switches[switchId].currentStateIndex + 1) %
      switches[switchId].states.length;
    logStatus(
      `分岔點 ${switchId} 切換為：${
        switches[switchId].states[switches[switchId].currentStateIndex]
          .name
      }`
    );
  }

  function createSwitchButtons() {
    for (let id in switches) {
      const btn = document.createElement("button");
      btn.textContent = `切換分岔點 ${id}`;
      btn.className = "switchBtn";
      btn.setAttribute("aria-pressed", "false");
      btn.onclick = () => {
        if (!gameRunning) return;
        toggleSwitch(id);
        updateSwitchButtons();
      };
      switchButtonsDiv.appendChild(btn);
    }
  }

  function updateSwitchButtons() {
    const buttons = switchButtonsDiv.querySelectorAll("button");
    let i = 0;
    for (let id in switches) {
      const sw = switches[id];
      let btn = buttons[i++];
      btn.classList.toggle("active", sw.currentStateIndex === 1);
      btn.setAttribute("aria-pressed", sw.currentStateIndex === 1 ? "true" : "false");
      btn.textContent = `切換分岔點 ${id} （目前: ${sw.states[sw.currentStateIndex].name}）`;
    }
  }

  function drawTracks() {
    ctx.lineCap = "round";
    ctx.lineWidth = 8;
    ctx.strokeStyle = "#9e9e9e";

    tracks.forEach(([fromKey, toKey]) => {
      if (
        (fromKey === "C" && toKey === "B" && switches.X1.currentStateIndex === 0) ||
        (fromKey === "C" && toKey === "F" && switches.X1.currentStateIndex === 1) ||
        (fromKey === "F" && toKey === "E" && switches.X2.currentStateIndex === 0) ||
        (fromKey === "F" && toKey === "G" && switches.X2.currentStateIndex === 1)
      ) {
        ctx.strokeStyle = "#f9a825";
      } else {
        ctx.strokeStyle = "#9e9e9e";
      }
      const from = nodes[fromKey];
      const to = nodes[toKey];
      ctx.beginPath();
      ctx.moveTo(from.x, from.y);
      ctx.lineTo(to.x, to.y);
      ctx.stroke();
    });
  }

  function drawNodes() {
    stations.forEach(stationId => {
      const p = nodes[stationId];
      ctx.fillStyle = "#4caf50";
      ctx.beginPath();
      ctx.arc(p.x, p.y, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#000";
      ctx.font = "bold 16px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(stationId, p.x, p.y);
    });

    for (let id in switches) {
      let sw = switches[id];
      ctx.fillStyle = sw.currentStateIndex === 0 ? "#2196f3" : "#f44336";
      ctx.beginPath();
      ctx.arc(sw.position.x, sw.position.y, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "bold 18px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(
        sw.states[sw.currentStateIndex].name.includes("B") ? "→" :
        sw.states[sw.currentStateIndex].name.includes("F") ? "↓" :
        sw.states[sw.currentStateIndex].name.includes("E") ? "→" :
        sw.states[sw.currentStateIndex].name.includes("G") ? "↓" : "?",
        sw.position.x,
        sw.position.y
      );
    }
  }

  function detectCollision() {
    for (let i = 0; i < trains.length - 1; i++) {
      for (let j = i + 1; j < trains.length; j++) {
        const t1 = trains[i];
        const t2 = trains[j];
        const dist = Math.hypot(t1.pos.x - t2.pos.x, t1.pos.y - t2.pos.y);
        if (dist < 30) {
          return true;
        }
      }
    }
    return false;
  }

  function logStatus(text) {
    const timeStr = new Date().toLocaleTimeString();
    const newLine = document.createElement("div");
    newLine.textContent = `[${timeStr}] ${text}`;
    statusDiv.appendChild(newLine);
    while (statusDiv.childNodes.length > 20) {
      statusDiv.removeChild(statusDiv.firstChild);
    }
    statusDiv.scrollTop = statusDiv.scrollHeight;
  }

  function gameLoop() {
    if (!gameRunning) return;
    ctx.clearRect(0, 0, W, H);
    drawTracks();
    drawNodes();
    globalFrameCount++;

    schedule.forEach(item => {
      if (globalFrameCount === item.startFrame) {
        logStatus(`✈️ 列車${item.trainId}出發！`);
        const t = trains.find(tr => tr.id === item.trainId);
        if (t) t.state = "moving";
      }
    });

    trains.forEach(train => {
      train.update();
      train.draw(ctx);
    });

    if (detectCollision()) {
      logStatus("⚠️ 警告：列車碰撞偵測！遊戲終止！");
      trains.forEach(t => (t.state = "stopped"));
      gameRunning = false;
      startButton.textContent = "重新開始";
      startButton.style.backgroundColor = "#e53935";
      controlPanel.hidden = true;
      startButton.hidden = false;
    } else {
      requestAnimationFrame(gameLoop);
    }
  }

  function resetGame() {
    trains.forEach(t => {
      t.currentNode = t.id === "1" ? "A" : t.id === "2" ? "D" : "B";
      t.nextNode = getNextNode(t.currentNode);
      t.progress = 0;
      t.state = "stopped";
      t.stopTimer = 0;
      t.pos = { ...nodes[t.currentNode] };
    });
    globalFrameCount = 0;
    for (let id in switches) {
      switches[id].currentStateIndex = 0;
    }
    updateSwitchButtons();
    statusDiv.textContent = "";
  }

  startButton.onclick = () => {
    if (gameRunning) return;
    resetGame();
    gameRunning = true;
    controlPanel.hidden = false;
    startButton.hidden = true;
    startButton.style.backgroundColor = "#4caf50";
    startButton.textContent = "開始遊戲";
    logStatus("遊戲開始，請操作分岔點並避免列車碰撞！");
    gameLoop();
  };

  createSwitchButtons();
  updateSwitchButtons();
})();
</script>

</body>
</html>
