<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>盲盒貨櫃競標完整遊戲</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.9.6/lottie.min.js"></script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #F5F5F5; color: #333;
      display: flex; flex-direction: column; align-items: center;
      margin: 0; padding: 20px; min-height: 100vh;
      transition: background-color 0.5s, color 0.5s;
    }
    body.dark {
      background: #222; color: #eee;
    }
    #container {
      width: 420px;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
      padding: 25px;
      text-align: center;
      transition: background-color 0.5s, color 0.5s;
    }
    body.dark #container {
      background: #333; color: #eee;
    }
    h1 {
      font-size: 2.4rem; margin-bottom: 15px; color: #FF6F31;
    }
    button {
      background: #FF6F31;
      border: none;
      color: #fff;
      padding: 10px 30px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.1rem;
      margin: 10px 5px;
      transition: background-color 0.3s;
    }
    button:hover {
      background: #FF845A;
    }
    button:disabled {
      background: #ccc; cursor: not-allowed;
    }
    /* 暱稱輸入 */
    #nameEntry {
      margin-bottom: 15px;
      text-align: center;
    }
    #playerNameInput {
      padding: 8px 12px;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      width: 240px;
    }
    #nameError {
      color: #d33;
      margin-top: 6px;
      display: none;
    }
    /* 遊戲區 */
    #gameArea {
      display: none; margin-top: 15px;
    }
    #boxImage, #animationContainer {
      width: 250px; height: 250px; margin: 10px auto 0 auto;
    }
    #animationContainer {
      display: none;
    }
    #infoPanel div {
      margin-bottom: 10px;
      font-size: 1.1rem;
    }
    #bidButtons button {
      margin: 5px;
      width: 80px;
    }
    #timer {
      font-size: 1.6rem;
      color: #FF6F31;
      font-weight: bold;
      margin: 20px 0;
    }
    #message {
      height: 30px;
      margin-top: 12px;
      font-weight: 600;
    }
    /* 設定面板 */
    #settingsModal {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    #settingsContent {
      background: #fff; color: #333;
      width: 320px; padding: 25px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      transition: background-color 0.5s, color 0.5s;
    }
    body.dark #settingsContent {
      background: #444; color: #eee;
    }
    #settingsContent h3 {
      margin-top: 0;
      margin-bottom: 20px;
    }
    .settings-row {
      margin-bottom: 15px;
      text-align: left;
    }
    label {
      font-weight: 600;
    }
    select, input[type=checkbox] {
      margin-top: 6px;
    }
    #settingsClose {
      cursor: pointer;
      width: 100%;
      background: #FF6F31;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      box-shadow: 0 5px 10px rgba(255,111,49,0.6);
      transition: background-color 0.3s;
    }
    #settingsClose:hover {
      background: #FF845A;
    }
  </style>
</head>
<body>
  <div id="container">
    <h1>盲盒貨櫃競標遊戲</h1>
    <div id="nameEntry">
      <label for="playerNameInput" style="font-weight: 700;">請輸入暱稱：</label><br/>
      <input type="text" id="playerNameInput" maxlength="12" placeholder="最多12字" />
      <button id="nameConfirmBtn">確定</button>
      <div id="nameError"></div>
    </div>
    <button id="btnStart" disabled>開始遊戲</button>
    <button id="btnSettings">設定</button>
    <button id="btnSaveLoad">匯出存檔</button>
    <button id="btnLoadSave">載入存檔</button>

    <div id="gameArea">
      <div id="boxImage" title="貨櫃盲盒" style="background:url('https://cdn-icons-png.flaticon.com/512/616/616408.png') no-repeat center/contain;"></div>
      <div id="animationContainer"></div>

      <div id="infoPanel">
        <div>你的資金：<span id="playerMoney">1000</span></div>
        <div>AI 資金：<span id="aiMoney">1000</span></div>
        <div>目前最高出價：<span id="highestBid">0</span> （最高出價者：<span id="highestBidder">無</span>）</div>
      </div>

      <div id="bidButtons">
        <button id="bidPlus1">出價 +1</button>
        <button id="bidPlus5">出價 +5</button>
        <button id="bidPlus10">出價 +10</button>
        <button id="btnPass" style="background-color:#888;">放棄競標</button>
      </div>

      <div id="timer">倒數計時：30</div>
      <div id="message"></div>
    </div>

  </div>

<script>
  // ===== 全域變數與元件綁定 =====
  let playerName = '';
  let player = { money: 1000 };
  let AI = { money: 1000, active: true };
  let highestBid = 0;
  let highestBidder = null;
  let countdown = 30;
  let biddingActive = false;
  let currentRound = 0;
  let totalRounds = 5;
  let playerTotalValue = 0;
  let playerInventory = [];
  let settings = { music: true, sfx: true, theme: 'light', difficulty: 'medium' };

  // DOM 元件
  const nameEntryDiv = document.getElementById('nameEntry');
  const playerNameInput = document.getElementById('playerNameInput');
  const nameConfirmBtn = document.getElementById('nameConfirmBtn');
  const nameErrorDiv = document.getElementById('nameError');

  const btnStart = document.getElementById('btnStart');
  const btnSettings = document.getElementById('btnSettings');
  const btnSaveLoad = document.getElementById('btnSaveLoad');
  const btnLoadSave = document.getElementById('btnLoadSave');

  const gameArea = document.getElementById('gameArea');
  const boxImage = document.getElementById('boxImage');
  const animationContainer = document.getElementById('animationContainer');
  const playerMoneySpan = document.getElementById('playerMoney');
  const aiMoneySpan = document.getElementById('aiMoney');
  const highestBidSpan = document.getElementById('highestBid');
  const highestBidderSpan = document.getElementById('highestBidder');
  const timerDiv = document.getElementById('timer');
  const messageDiv = document.getElementById('message');

  const bidPlus1 = document.getElementById('bidPlus1');
  const bidPlus5 = document.getElementById('bidPlus5');
  const bidPlus10 = document.getElementById('bidPlus10');
  const btnPass = document.getElementById('btnPass');

  const settingsModal = document.getElementById('settingsModal');
  const settingsClose = document.getElementById('settingsClose');
  const toggleMusic = document.getElementById('toggleMusic');
  const toggleSfx = document.getElementById('toggleSfx');
  const themeSelect = document.getElementById('themeSelect');
  const difficultySelect = document.getElementById('difficultySelect');

  const bgMusic = document.getElementById('bgMusic');
  const clickSfx = document.getElementById('clickSfx');
  const openBoxSfx = document.getElementById('openBoxSfx');

  let animation = null;
  let countdownInterval = null;

  // ===== 暱稱輸入事件 =====
  nameConfirmBtn.onclick = () => {
    const name = playerNameInput.value.trim();
    if(name.length < 2) {
      nameErrorDiv.textContent = '暱稱太短，請至少輸入2個字';
      nameErrorDiv.style.display = 'block';
      return;
    }
    if(name.length > 12) {
      nameErrorDiv.textContent = '暱稱過長，請勿超過12字';
      nameErrorDiv.style.display = 'block';
      return;
    }
    nameErrorDiv.style.display = 'none';
    playerName = name;
    savePlayerName(playerName);
    nameEntryDiv.style.display = 'none';
    btnStart.disabled = false;
    alert(`歡迎，${playerName}，祝你競標順利！`);
  };

  // ===== 儲存與讀取暱稱 =====
  function savePlayerName(name) {
    localStorage.setItem('blindbox_playerName', name);
  }
  function loadPlayerName() {
    const saved = localStorage.getItem('blindbox_playerName');
    if(saved) {
      playerName = saved;
      playerNameInput.value = playerName;
      nameEntryDiv.style.display = 'none';
      btnStart.disabled = false;
    }
  }

  // ===== 更新介面 =====
  function updateDisplay() {
    playerMoneySpan.textContent = player.money;
    aiMoneySpan.textContent = AI.money;
    highestBidSpan.textContent = highestBid;
    highestBidderSpan.textContent = highestBidder ? highestBidder : "無";
    timerDiv.textContent = `倒數計時：${countdown}`;
  }

  function disableBidButtons(disable) {
    bidPlus1.disabled = disable;
    bidPlus5.disabled = disable;
    bidPlus10.disabled = disable;
    btnPass.disabled = disable;
  }

  // ===== 開箱動畫 =====
  function resetAnimation() {
    if(animation) {
      animation.destroy();
      animation = null;
    }
    animationContainer.style.display = 'none';
    boxImage.style.display = 'block';
  }

  function playOpenBoxAnimation(callback) {
    playOpenBoxSound();
    boxImage.style.display = 'none';
    animationContainer.style.display = 'block';
    animation = lottie.loadAnimation({
      container: animationContainer,
      renderer:'svg', loop:false, autoplay:true,
      path:'https://assets6.lottiefiles.com/packages/lf20_hXJ81P.json'
    });
    animation.addEventListener('complete', () => {
      if(callback) callback();
      resetAnimation();
    });
  }

  // ===== 音樂及音效 =====
  function playMusic() {
    if(settings.music){
      bgMusic.volume = 0.3;
      bgMusic.play().catch(()=>{});
    } else {
      bgMusic.pause();
    }
  }
  function playClick() {
    if(settings.sfx){
      clickSfx.currentTime = 0;
      clickSfx.play();
    }
  }
  function playOpenBoxSound() {
    if(settings.sfx){
      openBoxSfx.currentTime = 0;
      openBoxSfx.play();
    }
  }

  // ===== 競標核心 =====
  function bid(amount, bidder) {
    if(!biddingActive) return;
    const newBid = highestBid + amount;
    if(bidder === playerName && player.money < newBid){
      messageDiv.textContent = '資金不足，無法出價！';
      return;
    }
    if(bidder === 'AI' && AI.money < newBid){
      AI.active = false;
      messageDiv.textContent = 'AI 資金不足放棄競標';
      return;
    }
    if(newBid <= highestBid){
      messageDiv.textContent = '出價須高於目前最高出價！';
      return;
    }
    highestBid = newBid;
    highestBidder = bidder;
    countdown = 15;
    messageDiv.textContent = `${bidder} 出價: ${highestBid}元`;
    updateDisplay();
  }

  function aiBid() {
    if(!AI.active) return;
    if(Math.random() < 0.7){
      const bidIncrement = Math.min(10, AI.money - highestBid);
      if(bidIncrement <= 0){
        AI.active = false;
        messageDiv.textContent = 'AI 放棄競標';
        return;
      }
      const increment = Math.floor(Math.random() * bidIncrement) + 1;
      bid(increment, 'AI');
    }
  }

  function startCountdown() {
    clearInterval(countdownInterval);
    countdownInterval = setInterval(() => {
      countdown--;
      if(biddingActive && AI.active && countdown % 5 === 0 && countdown > 10){
        aiBid();
      }
      if(countdown <= 0){
        endBidding();
      }
      updateDisplay();
    }, 1000);
  }

  // ===== 結束與開箱 =====
  function endBidding() {
    biddingActive = false;
    clearInterval(countdownInterval);
    if(highestBidder === playerName){
      player.money -= highestBid;
      messageDiv.textContent = `${playerName} 贏得此貨櫃，花費${highestBid}資金！開箱中...`;
      playOpenBoxAnimation(() => {
        onOpenBox(() => setTimeout(resetGame, 3000));
      });
    }else if(highestBidder === 'AI'){
      AI.money -= highestBid;
      messageDiv.textContent = `AI 贏得此貨櫃，花費${highestBid}資金！請稍待下一輪。`;
      setTimeout(resetGame, 4000);
    }else{
      messageDiv.textContent = "本輪無人競標，流標。請稍待下一輪。";
      setTimeout(resetGame, 4000);
    }
    disableBidButtons(true);
    updateDisplay();
  }

  // ===== 新一輪重置 =====
  function resetGame() {
    if(currentRound >= totalRounds){
      showFinalResults();
      return;
    }
    currentRound++;
    AI.active = true;
    highestBid = 0;
    highestBidder = null;
    countdown = 30;
    biddingActive = true;
    updateDisplay();
    disableBidButtons(false);
    resetAnimation();
    startCountdown();
    messageDiv.textContent = `第 ${currentRound} 輪競標開始，祝你好運！`;
  }

  // ===== 盲盒隨機獎品 =====
  function getRandomPrize() {
    const rand = Math.random();
    if(rand < 0.5) {
      return prizePool.filter(p => p.rarity === '普通')[Math.floor(Math.random() * 2)];
    } else if(rand < 0.8) {
      return prizePool.filter(p => p.rarity === '稀有')[Math.floor(Math.random() * 2)];
    } else if(rand < 0.95) {
      return prizePool.find(p => p.rarity === '史詩');
    } else {
      return prizePool.find(p => p.rarity === '傳說');
    }
  }

  // 開箱處理
  function onOpenBox(callback) {
    const prize = getRandomPrize();
    playerInventory.push(prize);
    playerTotalValue += prize.value;
    player.money += prize.value;
    messageDiv.textContent = `${playerName} 開出：${prize.rarity} - ${prize.name}（價值 ${prize.value}）！`;
    updateDisplay();
    if(callback) callback();
  }

  // ===== 顯示最終結果 =====
  function showFinalResults() {
    gameArea.style.display = 'none';
    alert(`遊戲結束！${playerName}在${totalRounds}輪中累積的貨櫃價值為${playerTotalValue}元！`);
    updatePlayerLeaderboard(playerName, playerTotalValue);
  }

  // ===== 存檔匯出匯入 =====
  // ...（此部分我稍後發送）

  // ===== 設定面板控制 =====
  // ...（此部分我稍後發送）

  // ===== 玩家資訊更新 =====
  // ...（此部分我稍後發送）

  // ===== 事件綁定 =====
  btnStart.onclick = () => {
    playClick();
    btnStart.style.display = 'none';
    btnSettings.style.display = 'none';
    btnSaveLoad.style.display = 'none';
    btnLoadSave.style.display = 'none';
    gameArea.style.display = 'block';
    resetGame();
  };

  btnSettings.onclick = () => {
    playClick();
    loadSettings();
    settingsModal.style.display = 'flex';
  };

  bidPlus1.onclick = () => { playClick(); bid(1, playerName); faqStep(); };
  bidPlus5.onclick = () => { playClick(); bid(5, playerName); faqStep(); };
  bidPlus10.onclick = () => { playClick(); bid(10, playerName); faqStep(); };
  btnPass.onclick = () => {
    playClick();
    if(!biddingActive) return;
    biddingActive = false;
    clearInterval(countdownInterval);
    messageDiv.textContent = `${playerName} 放棄本輪競標。`;
    disableBidButtons(true);
    setTimeout(resetGame, 3000);
    faqStep();
  };

  // ===== 新手教學 =====
  let tutorialStep = 0;
  const tutorialMessages = [
    '歡迎來到盲盒貨櫃競標遊戲！這裡顯示你的資金。',
    '用「出價+1」增加競標價格。',
    '也可以用「出價+5」或「出價+10」快速加價。',
    '放棄競標請點「放棄競標」。',
    '倒數計時提醒時間，祝你好運！',
    '提示完畢，加油參與競標吧！'
  ];
  const tutorialDiv = document.createElement('div');
  tutorialDiv.style.cssText = 'position:fixed; bottom:100px; width:420px; background:#FF6F31; color:#fff; padding:15px; border-radius:10px; font-weight:700; font-size:1.1rem; box-shadow:0 4px 12px rgba(255,111,49,0.9); text-align:center; user-select:none; left:50%; transform:translateX(-50%); z-index:1000';
  document.body.appendChild(tutorialDiv);

  function showTutorialStep() {
    if (tutorialStep >= tutorialMessages.length) {
      tutorialDiv.style.display = 'none';
      return;
    }
    tutorialDiv.style.display = 'block';
    tutorialDiv.textContent = tutorialMessages[tutorialStep];
  }

  function faqStep() {
    tutorialStep++;
    showTutorialStep();
  }
  showTutorialStep();

  // ===== 音效控制 (示範) =====
  function playClick() {
    if(settings.sfx){
      clickSfx.currentTime = 0;
      clickSfx.play();
    }
  }
  function playOpenBoxSound() {
    if(settings.sfx){
      openBoxSfx.currentTime = 0;
      openBoxSfx.play();
    }
  }
  function playMusic() {
    if(settings.music){
      bgMusic.volume = 0.3;
      bgMusic.play().catch(()=>{});
    } else {
      bgMusic.pause();
    }
  }

  window.onload = () => {
    loadPlayerName();
    loadSettings();
    applyTheme(settings.theme);
    playMusic();
  };
</script>
<script>
  // ===== 存檔匯出功能 =====
  function exportSave() {
    const saveData = {
      playerName,
      player,
      AI,
      highestBid,
      highestBidder,
      countdown,
      biddingActive,
      currentRound,
      totalRounds,
      playerTotalValue,
      playerInventory,
      settings
    };
    const dataStr = JSON.stringify(saveData, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `blindbox_save_${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ===== 存檔匯入功能 =====
  function importSave(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        playerName = data.playerName ?? playerName;
        player = data.player ?? player;
        AI = data.AI ?? AI;
        highestBid = data.highestBid ?? 0;
        highestBidder = data.highestBidder ?? null;
        countdown = data.countdown ?? 30;
        biddingActive = data.biddingActive ?? false;
        currentRound = data.currentRound ?? 0;
        totalRounds = data.totalRounds ?? 5;
        playerTotalValue = data.playerTotalValue ?? 0;
        playerInventory = data.playerInventory ?? [];
        settings = data.settings ?? settings;

        // 更新相關UI
        playerNameInput.value = playerName;
        savePlayerName(playerName);
        applyTheme(settings.theme);
        toggleMusic.checked = settings.music;
        toggleSfx.checked = settings.sfx;
        themeSelect.value = settings.theme;
        difficultySelect.value = settings.difficulty;

        updateDisplay();

        messageDiv.textContent = `成功載入遊戲進度，請點開始遊戲繼續。`;
        biddingActive = false;
        disableBidButtons(true);
        gameArea.style.display = 'none';
        btnStart.style.display = 'inline-block';
        btnSettings.style.display = 'inline-block';
        btnSaveLoad.style.display = 'inline-block';
        btnLoadSave.style.display = 'inline-block';
      } catch (error) {
        alert('載入檔案失敗，請確認檔案格式正確');
      }
    };
    reader.readAsText(file);
  }

  // 綁定匯出匯入按鈕
  btnSaveLoad.onclick = exportSave;
  btnLoadSave.onclick = () => fileInput.click();
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) {
      importSave(e.target.files[0]);
      fileInput.value = '';
    }
  });

  // ===== 設定面板控制 =====
  toggleMusic.addEventListener('change', () => {
    settings.music = toggleMusic.checked;
    playMusic();
    saveSettings();
  });

  toggleSfx.addEventListener('change', () => {
    settings.sfx = toggleSfx.checked;
    saveSettings();
  });

  themeSelect.addEventListener('change', () => {
    settings.theme = themeSelect.value;
    applyTheme(settings.theme);
    saveSettings();
  });

  difficultySelect.addEventListener('change', () => {
    settings.difficulty = difficultySelect.value;
    saveSettings();
  });

  settingsClose.onclick = () => {
    settingsModal.style.display = 'none';
  };

  // 儲存設定
  function saveSettings() {
    localStorage.setItem('blindbox_settings', JSON.stringify(settings));
  }

  // 載入設定
  function loadSettings() {
    const saved = localStorage.getItem('blindbox_settings');
    if (saved) {
      try {
        settings = JSON.parse(saved);
      } catch (e) {}
    }
    toggleMusic.checked = settings.music;
    toggleSfx.checked = settings.sfx;
    themeSelect.value = settings.theme;
    difficultySelect.value = settings.difficulty;
  }

  // 主題套用
  function applyTheme(theme) {
    if (theme === 'dark') document.body.classList.add('dark');
    else document.body.classList.remove('dark');
  }

</script>
<script>
  // ===== 排行榜系統 =====
  const leaderboardKey = 'blindbox_leaderboard';

  function loadLeaderboard() {
    let data = [];
    const stored = localStorage.getItem(leaderboardKey);
    if (stored) {
      try {
        data = JSON.parse(stored);
      } catch (e) {}
    }
    return data;
  }

  function saveLeaderboard(data) {
    localStorage.setItem(leaderboardKey, JSON.stringify(data));
  }

  function updatePlayerLeaderboard(name, totalValue) {
    const data = loadLeaderboard();
    const index = data.findIndex(p => p.name === name);
    if (index === -1) data.push({ name, totalValue });
    else if (totalValue > data[index].totalValue) data[index].totalValue = totalValue;
    saveLeaderboard(data);
    updateLeaderboardUI();
  }

  function updateLeaderboardUI() {
    const container = document.getElementById('leaderboardContainer');
    const list = document.getElementById('leaderboardList');
    const data = loadLeaderboard().sort((a, b) => b.totalValue - a.totalValue);
    list.innerHTML = '';
    if (data.length === 0) {
      list.innerHTML = '<li>尚無記錄</li>';
    } else {
      data.slice(0, 5).forEach((item, i) => {
        const li = document.createElement('li');
        li.textContent = `${i + 1}. ${item.name} - 總貨櫃價值：${item.totalValue}`;
        list.appendChild(li);
      });
    }
    container.style.display = 'block';
  }

  document.getElementById('closeLeaderboard').onclick = () => {
    document.getElementById('leaderboardContainer').style.display = 'none';
  };

  // ===== 商店系統 =====
  const shopItems = [
    { id: 1, name: "增價保證卡", description: "下一輪出價自動加倍", price: 100 },
    { id: 2, name: "時間延長器", description: "下一輪競標時間加長10秒", price: 150 },
    { id: 3, name: "AI干擾器", description: "降低AI出價積極度 30秒", price: 200 },
  ];

  let playerInventoryMap = {};

  const btnShop = document.getElementById('btnShop');
  const shopContainer = document.getElementById('shopContainer');
  const shopList = document.getElementById('shopList');
  const closeShop = document.getElementById('closeShop');

  btnShop.onclick = () => {
    renderShopItems();
    shopContainer.style.display = 'block';
  };

  closeShop.onclick = () => {
    shopContainer.style.display = 'none';
  };

  function renderShopItems() {
    shopList.innerHTML = '';
    shopItems.forEach(item => {
      const li = document.createElement('li');
      li.textContent = `${item.name} - ${item.description}（價格: ${item.price}）`;
      const buyBtn = document.createElement('button');
      buyBtn.textContent = '購買';
      buyBtn.disabled = player.money < item.price;
      buyBtn.onclick = () => {
        if (player.money >= item.price) {
          player.money -= item.price;
          playerInventoryMap[item.id] = (playerInventoryMap[item.id] || 0) + 1;
          updatePlayerMoneyDisplay();
          buyBtn.disabled = true;
          alert(`成功購買 ${item.name}！`);
        } else {
          alert('資金不足，無法購買！');
        }
      };
      li.appendChild(buyBtn);
      shopList.appendChild(li);
    });
  }

  function updatePlayerMoneyDisplay() {
    playerMoneySpan.textContent = player.money;
  }

</script>
