<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>寫實刮刮樂遊戲範例</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700&display=swap');

    body {
      margin: 0;
      background: #121212;
      color: #fff;
      font-family: 'Noto Sans TC', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      height: 100vh;
      padding: 20px;
      user-select: none;
    }
    h1 {
      font-weight: 900;
      font-size: 2.5rem;
      margin-bottom: 15px;
      letter-spacing: 3px;
      color: #f5c518; /* 金色調 */
      text-shadow: 0 0 8px #f5c518;
    }
    #balance-container {
      background: linear-gradient(135deg, #3b2f0a, #776a17);
      border-radius: 12px;
      padding: 12px 30px;
      margin-top: 10px;
      box-shadow: 0 0 15px #f5c518aa;
      font-size: 1.5rem;
      width: 270px;
      text-align: center;
      letter-spacing: 2px;
    }
    #btn-buy {
      margin-top: 25px;
      cursor: pointer;
      background: linear-gradient(145deg, #d3aa1c, #f6d85c);
      color: #4b4000;
      border: none;
      font-weight: 900;
      font-size: 1.25rem;
      border-radius: 14px;
      padding: 12px 28px;
      box-shadow: 0 4px 6px #b08f00;
      transition: all 0.15s ease-in-out;
      user-select: none;
    }
    #btn-buy:hover {
      background: linear-gradient(145deg, #f6d85c, #d3aa1c);
      box-shadow: 0 6px 12px #b08f00;
      transform: scale(1.05);
    }
    #btn-buy:active {
      transform: scale(0.95);
      box-shadow: 0 2px 4px #b08f00;
    }
    #game-container {
      margin-top: 25px;
      width: 400px;
      height: 300px;
      box-shadow:
        0 0 10px rgba(245,197,24,0.7),
        inset 0 0 15px rgba(255,255,255,0.12);
      border-radius: 18px;
      background: linear-gradient(90deg, #eeeeee 20%, #b3af9e 90%);
      position: relative;
      user-select: none;
      overflow: hidden;
    }

    /* 中獎提示框 */
    #win-popup {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: #f5c518;
      color: #3c2f00;
      padding: 16px 30px;
      font-weight: 900;
      font-size: 1.6rem;
      border-radius: 30px;
      box-shadow: 0 0 20px #f5c518cc;
      pointer-events: none;
      user-select: none;
      z-index: 15;
      transition: transform 0.3s ease-out;
    }
    #win-popup.show {
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
      animation: pulseGlow 1.2s infinite alternate;
    }
    @keyframes pulseGlow {
      from { box-shadow: 0 0 20px #f5c518cc; }
      to { box-shadow: 0 0 40px #f5c518ff; }
    }
  </style>
</head>
<body>
  <h1>寫實刮刮樂</h1>
  <div id="balance-container">累積金額：0 元</div>
  <button id="btn-buy">買一張刮刮樂</button>
  <div id="game-container"></div>
  <div id="win-popup"></div>

  <script>
    // Phaser 遊戲初始化
    const config = {
      type: Phaser.AUTO,
      width: 400,
      height: 300,
      parent: 'game-container',
      backgroundColor: '#b3af9e',
      scene: {
        preload,
        create
      }
    };

    const PRIZES = [
      { text: '中獎 100 元', value: 100 },
      { text: '中獎 50 元', value: 50 },
      { text: '中獎 10 元', value: 10 },
      { text: '沒中獎', value: 0 },
      { text: '中獎 500 元', value: 500 },
      { text: '中獎 200 元', value: 200 },
      { text: '沒中獎', value: 0 }
    ];

    let game = new Phaser.Game(config);
    let maskGraphics;
    let revealedArea = 0;
    let totalArea = 400 * 300;
    let scratchComplete = false;
    let currentPrize = null;
    let prizeText;

    const balanceContainer = document.getElementById('balance-container');
    const btnBuy = document.getElementById('btn-buy');
    const winPopup = document.getElementById('win-popup');

    // 讀取 LocalStorage 累積金額
    let balance = parseInt(localStorage.getItem('scratch_balance')) || 0;
    updateBalanceDisplay();

    function updateBalanceDisplay() {
      balanceContainer.textContent = `累積金額：${balance} 元`;
    }

    function preload() {
      this.load.image('bg', 'https://i.imgur.com/zfV9xy0.png');  // 獎品背景
      this.load.image('scratch', 'https://i.imgur.com/eKXXAEc.png'); // 銀色刮層
    }

    function create() {
      const scene = this;

      resetScratchState();

      currentPrize = Phaser.Utils.Array.GetRandom(PRIZES);

      // 底圖展示獎品文字
      const bg = scene.add.image(200, 150, 'bg');
      prizeText = scene.add.text(200, 150, currentPrize.text, {
        fontSize: '36px',
        fontWeight: '900',
        color: '#fff',
        stroke: '#4a3900',
        strokeThickness: 7,
        shadow: { offsetX: 2, offsetY: 4, color: '#776600', blur: 3, fill: true }
      }).setOrigin(0.5);

      // 覆蓋刮層
      const scratch = scene.add.image(200, 150, 'scratch');

      // 遮罩用 Graphics
      maskGraphics = scene.make.graphics();
      maskGraphics.fillStyle(0xffffff);
      maskGraphics.fillRect(0, 0, 400, 300);
      const mask = maskGraphics.createGeometryMask();

      scratch.setMask(mask);

      scene.input.on('pointermove', pointer => {
        if (!pointer.isDown || scratchComplete) return;

        // 擦除遮罩圓圈
        maskGraphics.fillCircle(pointer.x, pointer.y, 20);

        // 累積刮開面積 (大約)
        revealedArea += Math.PI * 20 * 20;

        if (revealedArea > totalArea * 0.4) {
          scratchComplete = true;
          showWinPopup();
          if (currentPrize.value > 0) {
            balance += currentPrize.value;
            localStorage.setItem('scratch_balance', balance);
            updateBalanceDisplay();
          }
        }
      });
    }

    function resetScratchState() {
      maskGraphics && maskGraphics.clear();
      revealedArea = 0;
      scratchComplete = false;
      winPopup.classList.remove('show');
      winPopup.textContent = '';
    }

    function showWinPopup() {
      if (currentPrize.value > 0) {
        winPopup.textContent = `恭喜你中了 ${currentPrize.value} 元！`;
      } else {
        winPopup.textContent = '很可惜沒中獎，再接再厲！';
      }
      winPopup.classList.add('show');
      // 3秒後自動隱藏提示
      setTimeout(() => {
        winPopup.classList.remove('show');
      }, 3000);
    }

    btnBuy.addEventListener('click', () => {
      // 重新啟動 Phaser 場景
      game.scene.scenes[0].scene.restart();
    });
  </script>
</body>
</html>
