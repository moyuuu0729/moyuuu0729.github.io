<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>多票券寫實刮刮樂＋每日簽到</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
<style>
  body {
    margin: 0;
    background: #121212;
    font-family: 'Noto Sans TC', sans-serif;
    color: #f5c518;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    user-select: none;
    min-height: 100vh;
  }
  h1 {
    font-weight: 900;
    font-size: 2.5rem;
    text-shadow: 0 0 8px #f5c518;
    margin-bottom: 20px;
  }
  #balance {
    font-size: 1.7rem;
    font-weight: 900;
    margin-bottom: 15px;
    background: linear-gradient(135deg, #3b2f0a, #776a17);
    padding: 12px 36px;
    border-radius: 14px;
    box-shadow: 0 0 20px #f5c518bb;
    width: 300px;
    text-align: center;
  }
  select, button {
    font-weight: 900;
    font-size: 1.3rem;
    width: 300px;
    border-radius: 18px;
    border: none;
    cursor: pointer;
    user-select: none;
    margin-bottom: 14px;
    padding: 14px 0;
    box-shadow: 0 5px 12px #b08f00;
    transition: all 0.2s ease;
  }
  select {
    background: #3b2f0a;
    color: #fff;
  }
  select:hover {
    box-shadow: 0 7px 15px #b08f00;
  }
  button#btn-buy {
    background: linear-gradient(145deg, #d3aa1c, #f6d85c);
    color: #4b4000;
  }
  button#btn-buy:hover:not(:disabled) {
    background: linear-gradient(145deg, #f6d85c, #d3aa1c);
    box-shadow: 0 6px 18px #b08f00;
    transform: scale(1.05);
  }
  button#btn-buy:active:not(:disabled) {
    transform: scale(0.95);
    box-shadow: 0 3px 7px #b08f00;
  }
  button#btn-buy:disabled {
    background: #a1964d66;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
    color: #5a5415;
  }
  button#btn-signin {
    background: #4caf5080;
    color: #fff;
    box-shadow: 0 0 10px #4caf50aa;
  }
  button#btn-signin:hover:not(:disabled) {
    background: #4caf50;
    box-shadow: 0 0 15px #4caf50cc;
  }
  button#btn-signin:disabled {
    background: #2e7d3200;
    box-shadow: none;
    cursor: default;
  }
  #game-container {
    width: 420px;
    height: 320px;
    border-radius: 20px;
    box-shadow: inset 0 0 40px #f5c518dd;
    background: linear-gradient(135deg, #eee9dc, #bcb3a1);
    position: relative;
    overflow: hidden;
    user-select: none;
  }
</style>
</head>
<body>

<h1>多票券寫實刮刮樂＋每日簽到</h1>

<div id="balance">累積金額：0 元</div>

<button id="btn-signin">每日簽到 ⏰</button>

<select id="ticket-select">
  <option value="1">經典刮刮樂（10元）</option>
  <option value="2">黃金刮刮樂（30元）</option>
  <option value="3">鉑金刮刮樂（50元）</option>
</select>

<button id="btn-buy">買一張刮刮樂</button>

<div id="game-container"></div>

<script>
  const TICKETS = {
    1: {
      price: 10,
      prizes: [
        { text: '中獎50元', prob: 0.1, value: 50 },
        { text: '中獎10元', prob: 0.2, value: 10 },
        { text: '沒中獎', prob: 0.7, value: 0 }
      ]
    },
    2: {
      price: 30,
      prizes: [
        { text: '中獎200元', prob: 0.05, value: 200 },
        { text: '中獎50元', prob: 0.25, value: 50 },
        { text: '沒中獎', prob: 0.7, value: 0 }
      ]
    },
    3: {
      price: 50,
      prizes: [
        { text: '中獎500元', prob: 0.02, value: 500 },
        { text: '中獎100元', prob: 0.1, value: 100 },
        { text: '中獎20元', prob: 0.18, value: 20 },
        { text: '沒中獎', prob: 0.7, value: 0 }
      ]
    }
  };

  const STORAGE_BALANCE = 'scratch_accumulated_balance';
  const STORAGE_SIGNIN_DATE = 'scratch_signin_date';

  let balance = parseInt(localStorage.getItem(STORAGE_BALANCE)) || 0;

  const balanceEl = document.getElementById('balance');
  const btnSignin = document.getElementById('btn-signin');
  const ticketSelect = document.getElementById('ticket-select');
  const btnBuy = document.getElementById('btn-buy');

  balanceEl.textContent = `累積金額：${balance} 元`;

  // 更新簽到按鈕狀態
  function updateSigninBtn() {
    const today = new Date().toISOString().slice(0, 10);
    const lastSignin = localStorage.getItem(STORAGE_SIGNIN_DATE);
    if (lastSignin === today) {
      btnSignin.disabled = true;
      btnSignin.textContent = '今天已簽到 ✅';
    } else {
      btnSignin.disabled = false;
      btnSignin.textContent = '每日簽到 ⏰';
    }
  }
  updateSigninBtn();

  btnSignin.addEventListener('click', () => {
    const today = new Date().toISOString().slice(0, 10);
    const lastSignin = localStorage.getItem(STORAGE_SIGNIN_DATE);
    if (lastSignin === today) {
      alert('今天已簽到過囉！明天再來～');
      return;
    }
    balance += 500;
    localStorage.setItem(STORAGE_BALANCE, balance);
    localStorage.setItem(STORAGE_SIGNIN_DATE, today);
    balanceEl.textContent = `累積金額：${balance} 元`;
    updateSigninBtn();
    alert('簽到成功！獲得500元');
  });

  btnBuy.addEventListener('click', () => {
    const selected = ticketSelect.value;
    const ticket = TICKETS[selected];
    if (balance < ticket.price) {
      alert(`餘額不足，無法購買此票（${ticket.price}元）`);
      return;
    }
    balance -= ticket.price;
    localStorage.setItem(STORAGE_BALANCE, balance);
    balanceEl.textContent = `累積金額：${balance} 元`;

    btnBuy.disabled = true;

    game.scene.scenes[0].scene.restart();
  });

  const config = {
    type: Phaser.AUTO,
    width: 420,
    height: 320,
    parent: 'game-container',
    backgroundColor: 0xbcb3a1,
    scene: { create }
  };

  const game = new Phaser.Game(config);

  let prizeText,
      renderTexture,
      maskGraphics,
      scratchedPixels = 0,
      scratching = false,
      scratchedComplete = false,
      currentPrize;

  const totalPixels = 420 * 320;

  function create(){
    const scene = this;

    if(prizeText) prizeText.destroy();
    if(renderTexture) renderTexture.destroy();
    if(maskGraphics) maskGraphics.destroy();

    // 抽獎品
    const selected = ticketSelect.value;
    const ticket = TICKETS[selected];
    currentPrize = choosePrize(ticket.prizes);

    prizeText = scene.add.text(210, 160, currentPrize.text, {
      fontSize: '56px',
      fontWeight: '900',
      color: '#4a3800',
      stroke: '#fffbaf',
      strokeThickness: 6,
      shadow: { offsetX: 3, offsetY: 3, color: '#c6b96f', blur: 5, fill: true }
    }).setOrigin(0.5);

    // 灰色遮罩
    renderTexture = scene.make.renderTexture({ width: 420, height: 320, add: true });
    renderTexture.fill(0x999999, 1);

    maskGraphics = scene.make.graphics();

    scratchedPixels = 0;
    scratchedComplete = false;
    scratching = false;

    scene.input.on('pointerdown', () => { if(!scratchedComplete) scratching = true;});
    scene.input.on('pointerup', () => { scratching = false; });
    scene.input.on('pointerout', () => { scratching = false; });
    scene.input.on('pointermove', pointer => {
      if(!scratching || scratchedComplete) return;
      maskGraphics.clear();
      maskGraphics.fillStyle(0xffffff, 1);
      maskGraphics.fillCircle(pointer.x, pointer.y, 30);
      renderTexture.erase(maskGraphics);

      scratchedPixels += Math.PI*30*30;
      if(scratchedPixels > totalPixels*0.4){
        scratchedComplete = true;
        onScratchComplete();
      }
    });
  }

  function choosePrize(prizes){
    let p = Math.random();
    let cumProb = 0;
    for(let pr of prizes){
      cumProb += pr.prob;
      if(p <= cumProb) return pr;
    }
    return prizes[prizes.length - 1];
  }

  function onScratchComplete(){
    btnBuy.disabled = false;
    if(currentPrize.value > 0){
      balance += currentPrize.value;
      localStorage.setItem(STORAGE_BALANCE, balance);
      balanceEl.textContent = `累積金額：${balance} 元`;
      alert(`恭喜中獎：${currentPrize.text}！`);
    } else {
      alert('很可惜沒中獎，再接再厲！');
    }
  }

</script>
</body>
</html>
