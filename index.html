<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>手機友善簡單停車遊戲</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #e0f7fa;
    margin: 0;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    margin-bottom: 5px;
  }
  #gameArea {
    position: relative;
    width: 90vw;
    max-width: 400px;
    height: 200px;
    background: #a7d7f9;
    border: 2px solid #2196f3;
    margin-top: 10px;
    border-radius: 8px;
  }
  #parkingSpot {
    position: absolute;
    bottom: 20px;
    left: 40%;
    width: 20%;
    height: 60px;
    background: #81c784;
    border: 2px dashed #388e3c;
    border-radius: 8px;
  }
  #car {
    position: absolute;
    bottom: 30px;
    left: 2%;
    width: 15%;
    height: 30px;
    background: #f44336;
    border-radius: 8px 8px 4px 4px;
    transition: left 0.2s ease;
  }
  #message {
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
    height: 24px;
    color: #333;
  }
  #controls {
    margin-top: 15px;
    width: 90vw;
    max-width: 400px;
    display: flex;
    justify-content: space-around;
  }
  button {
    flex: 1;
    margin: 0 6px;
    padding: 12px 0;
    font-size: 18px;
    border-radius: 8px;
    border: none;
    background-color: #2196f3;
    color: white;
    user-select: none;
    touch-action: manipulation;
    transition: background-color 0.3s;
  }
  button:active {
    background-color: #1769aa;
  }
  @media (hover: hover) and (pointer: fine) {
    button:hover {
      background-color: #1769aa;
      cursor: pointer;
    }
  }
</style>
</head>
<body>

<h1>簡單停車遊戲</h1>
<p>點擊「左移」「停車」「右移」按鈕控制車子停車。</p>

<div id="gameArea">
  <div id="parkingSpot"></div>
  <div id="car"></div>
</div>

<div id="message"></div>

<div id="controls">
  <button id="leftBtn">左移</button>
  <button id="stopBtn">停車</button>
  <button id="rightBtn">右移</button>
</div>

<script>
  const car = document.getElementById('car');
  const parkingSpot = document.getElementById('parkingSpot');
  const message = document.getElementById('message');

  // 以 vw％為單位，方便響應式改動，這裡使用 pixel 值對應寬度百分比計算移動
  const gameArea = document.getElementById('gameArea');
  let gameAreaWidth = 0;
  let carWidth = 0;
  let parkingLeft = 0;
  let parkingRight = 0;

  function updateSizes() {
    gameAreaWidth = gameArea.clientWidth;
    carWidth = car.clientWidth;
    parkingLeft = parkingSpot.offsetLeft;
    parkingRight = parkingLeft + parkingSpot.offsetWidth;
  }

  // 以 pixel 計算車子位置
  let carPos = 0;

  function updateCarPosition() {
    car.style.left = carPos + 'px';
  }

  function clamp(value, min, max) {
    return Math.min(Math.max(value, min), max);
  }

  window.addEventListener('resize', () => {
    updateSizes();
    carPos = clamp(carPos, 0, gameAreaWidth - carWidth);
    updateCarPosition();
  });

  // 初次執行更新尺寸與初始位置
  updateSizes();
  carPos = 0;
  updateCarPosition();

  // 按鈕事件
  document.getElementById('leftBtn').addEventListener('click', () => {
    carPos = clamp(carPos - 20, 0, gameAreaWidth - carWidth);
    updateCarPosition();
    message.textContent = '';
  });

  document.getElementById('rightBtn').addEventListener('click', () => {
    carPos = clamp(carPos + 20, 0, gameAreaWidth - carWidth);
    updateCarPosition();
    message.textContent = '';
  });

  document.getElementById('stopBtn').addEventListener('click', () => {
    // 判斷車子是否停在停車格內
    const carLeft = carPos;
    const carRight = carPos + carWidth;

    if (carLeft >= parkingLeft && carRight <= parkingRight) {
      message.style.color = 'green';
      message.textContent = '恭喜！成功停車！🚗✅';
    } else {
      message.style.color = 'red';
      message.textContent = '未停好喔，請再嘗試！';
    }
  });
</script>

</body>
</html>
