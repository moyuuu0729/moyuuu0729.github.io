<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>刮刮樂抽獎遊戲</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>刮刮樂抽獎</h1>

  <div id="inputSection">
    <label>輸入暱稱：</label><br />
    <input type="text" id="nicknameInput" placeholder="請輸入暱稱" />
    <br />
    <button id="startBtn">開始遊戲</button>
  </div>

  <div id="gameSection" style="display:none;">
    <div>玩家：<span id="nicknameDisplay"></span></div>
    <div id="balance">帳戶餘額：<span id="balanceAmount">0</span> 元</div>
    <button id="buyCardBtn">購買刮刮樂 (10元)</button>

    <canvas id="scratchCanvas" width="300" height="150" style="display:none;"></canvas>
    <div id="resultMsg"></div>

    <button id="resetBtn" style="display:none;">重新購買</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
