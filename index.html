<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>寫實拆盲盒遊戲</title>
<style>
  body {
    margin: 0; background: #121212; font-family: 'Noto Sans TC', sans-serif;
    color: #f5c518; display: flex; flex-direction: column; align-items: center;
    padding: 20px; user-select: none; min-height: 100vh;
  }
  h1 {
    font-weight: 900; font-size: 2.5rem; text-shadow: 0 0 8px #f5c518;
    margin-bottom: 20px;
  }
  #balance {
    font-size: 1.7rem; font-weight: 900; margin-bottom: 15px;
    background: linear-gradient(135deg, #3b2f0a, #776a17);
    padding: 12px 36px; border-radius: 14px; box-shadow: 0 0 20px #f5c518bb;
    width: 300px; text-align: center;
  }
  select, button {
    font-weight: 900; font-size: 1.3rem; width: 300px; border-radius: 18px;
    border: none; cursor: pointer; user-select: none; margin-bottom: 14px;
    padding: 14px 0; box-shadow: 0 5px 12px #b08f00;
    transition: all 0.2s ease;
  }
  select {
    background: #3b2f0a; color: #fff;
  }
  select:hover {
    box-shadow: 0 7px 15px #b08f00;
  }
  button#btn-open {
    background: linear-gradient(145deg, #d3aa1c, #f6d85c);
    color: #4b4000;
  }
  button#btn-open:hover:not(:disabled) {
    background: linear-gradient(145deg, #f6d85c, #d3aa1c);
    box-shadow: 0 6px 18px #b08f00;
    transform: scale(1.05);
  }
  button#btn-open:active:not(:disabled) {
    transform: scale(0.95);
    box-shadow: 0 3px 7px #b08f00;
  }
  button#btn-open:disabled {
    background: #a1964d66;
    cursor: not-allowed;
    box-shadow: none;
    color: #5a5415;
    transform: none;
  }
  button#btn-signin {
    background: #4caf5080;
    color: #fff;
    box-shadow: 0 0 10px #4caf50aa;
  }
  button#btn-signin:hover:not(:disabled) {
    background: #4caf50;
    box-shadow: 0 0 15px #4caf50cc;
  }
  button#btn-signin:disabled {
    background: #2e7d3200;
    box-shadow: none;
    cursor: default;
  }
  #result-container {
    margin-top: 20px;
    background: #ddd2a4;
    color: #3c2f00;
    font-weight: 900;
    font-size: 1.8rem;
    padding: 20px 40px;
    border-radius: 24px;
    box-shadow: 0 0 30px #f5c518ee;
    min-height: 72px;
    text-align: center;
    user-select: none;
    opacity: 0;
    transition: opacity 0.7s ease-in-out;
  }
  #result-container.show {
    opacity: 1;
  }
</style>
</head>
<body>

<h1>寫實拆盲盒遊戲</h1>

<div id="balance">累積金額：1000 元</div>

<button id="btn-signin">每日簽到 ⏰</button>

<select id="box-select">
  <option value="1">經典盲盒（10元）</option>
  <option value="2">黃金盲盒（30元）</option>
  <option value="3">鉑金盲盒（50元）</option>
</select>

<button id="btn-open">拆開盲盒</button>

<div id="result-container"></div>


<script>
  const BALANCE_KEY = 'blindbox_balance';
  const SIGNIN_KEY = 'blindbox_signin_date';

  let balance = parseInt(localStorage.getItem(BALANCE_KEY));
  if (isNaN(balance)) balance = 1000;

  const baseProbs = {
    1: [
      { text: '抽中50元', value: 50, prob: 0.1 },
      { text: '抽中10元', value: 10, prob: 0.2 },
      { text: '沒抽中', value: 0, prob: 0.7 }
    ],
    2: [
      { text: '抽中200元', value: 200, prob: 0.05 },
      { text: '抽中50元', value: 50, prob: 0.25 },
      { text: '沒抽中', value: 0, prob: 0.7 }
    ],
    3: [
      { text: '抽中500元', value: 500, prob: 0.02 },
      { text: '抽中100元', value: 100, prob: 0.1 },
      { text: '抽中20元', value: 20, prob: 0.18 },
      { text: '沒抽中', value: 0, prob: 0.7 }
    ]
  };

  const balanceEl = document.getElementById('balance');
  const btnSignin = document.getElementById('btn-signin');
  const boxSelect = document.getElementById('box-select');
  const btnOpen = document.getElementById('btn-open');
  const resultContainer = document.getElementById('result-container');

  function updateBalanceDisplay() {
    balanceEl.textContent = `累積金額：${balance} 元`;
  }
  updateBalanceDisplay();

  // 簽到按鈕狀態
  function updateSigninBtn() {
    const today = new Date().toISOString().slice(0,10);
    const lastSignin = localStorage.getItem(SIGNIN_KEY);
    if (lastSignin === today) {
      btnSignin.disabled = true;
      btnSignin.textContent = '今天已簽到 ✅';
    } else {
      btnSignin.disabled = false;
      btnSignin.textContent = '每日簽到 ⏰';
    }
  }
  updateSigninBtn();

  btnSignin.addEventListener('click', () => {
    const today = new Date().toISOString().slice(0,10);
    if (localStorage.getItem(SIGNIN_KEY) === today) {
      alert('今天已簽到過囉！明天再來～');
      return;
    }
    balance += 500;
    localStorage.setItem(BALANCE_KEY, balance);
    localStorage.setItem(SIGNIN_KEY, today);
    updateBalanceDisplay();
    updateSigninBtn();
    alert('簽到成功！獲得500元');
  });

  function drawPrize(prizes) {
    let r = Math.random();
    let c = 0;
    for (let prize of prizes) {
      c += prize.prob;
      if (r <= c) return prize;
    }
    return prizes[prizes.length - 1];
  }

  btnOpen.addEventListener('click', () => {
    let selected = boxSelect.value;
    let price = [10, 30, 50][selected - 1];

    if (balance < price) {
      alert(`你的金額不足，無法購買此盲盒（需要${price}元）`);
      return;
    }

    balance -= price;
    localStorage.setItem(BALANCE_KEY, balance);
    updateBalanceDisplay();

    resultContainer.classList.remove('show');
    resultContainer.textContent = '';

    // 模擬開盒動畫效果（文字閃爍）
    let count = 0;
    let timer = setInterval(() => {
      const dots = '.'.repeat(count % 4);
      resultContainer.textContent = '拆盒中' + dots;
      resultContainer.classList.add('show');
      count++;
    }, 500);

    setTimeout(() => {
      clearInterval(timer);
      const prize = drawPrize(baseProbs[selected]);
      resultContainer.textContent = prize.value > 0 ? `恭喜你！抽中：${prize.text}` : '很可惜，沒中獎';
      resultContainer.classList.add('show');

      if (prize.value > 0) {
        balance += prize.value;
        localStorage.setItem(BALANCE_KEY, balance);
        updateBalanceDisplay();
      }
    }, 3000);
  });
</script>

</body>
</html>
