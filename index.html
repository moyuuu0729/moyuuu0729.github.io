<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>刮刮樂 - 完整遮罩刮開範例</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
<style>
  body {
    background: #111;
    color: #f5c518;
    text-align: center;
    font-family: 'Noto Sans TC', sans-serif;
    user-select: none;
    margin: 20px;
  }
  #game-container {
    margin: 0 auto;
    width: 420px;
    height: 320px;
    border-radius: 20px;
    box-shadow: 0 0 30px #f5c518aa inset;
    background: linear-gradient(135deg, #eee9dc, #bcb3a1);
    position: relative;
  }
  #balance {
    margin-top: 10px;
    font-size: 1.4rem;
    font-weight: 900;
    letter-spacing: 3px;
  }
  #btn-buy, #btn-signin {
    margin: 15px 5px;
    font-weight: 900;
    font-size: 1.2rem;
    padding: 12px 30px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    user-select: none;
    color: #4b4000;
    background: linear-gradient(145deg, #d3aa1c, #f6d85c);
    box-shadow: 0 4px 10px #b08f00;
    transition: 0.2s ease;
  }
  #btn-buy:hover, #btn-signin:hover {
    background: linear-gradient(145deg, #f6d85c, #d3aa1c);
    box-shadow: 0 6px 15px #b08f00;
    transform: scale(1.05);
  }
  #btn-buy:active, #btn-signin:active {
    transform: scale(0.95);
    box-shadow: 0 2px 5px #b08f00;
  }
  #win-popup {
    position: absolute;
    top: 50%;
    left: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(0);
    background: #f5c518;
    color: #3c2f00;
    font-weight: 900;
    font-size: 1.6rem;
    padding: 16px 35px;
    border-radius: 24px;
    box-shadow: 0 0 30px #f5c518ee;
    user-select: none;
    transition: transform 0.3s ease;
    white-space: nowrap;
    z-index: 10;
  }
  #win-popup.show {
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
    animation: pulseGlow 1.5s infinite alternate;
  }
  @keyframes pulseGlow {
    from { box-shadow: 0 0 20px #f5c518cc; }
    to { box-shadow: 0 0 40px #f5c518ff; }
  }
</style>
</head>
<body>
<h1>刮刮樂（直接完整遮罩）</h1>
<div id="balance">累積金額：0 元</div>
<button id="btn-signin">每日簽到 +500 元</button>
<button id="btn-buy">買一張刮刮樂</button>
<div id="game-container"></div>
<div id="win-popup"></div>

<script>
// 票券資料
const TICKETS = {
  1: {
    name: "經典刮刮樂",
    price: 10,
    prizes: [
      { text: '中獎 50 元', prob: 0.1, value: 50 },
      { text: '中獎 10 元', prob: 0.2, value: 10 },
      { text: '沒中獎', prob: 0.7, value: 0 }
    ]
  }
};

// Phaser 配置
const config = {
  type: Phaser.AUTO,
  width: 420,
  height: 320,
  parent: 'game-container',
  backgroundColor: 0xbcb3a1,
  scene: { preload, create }
};

const game = new Phaser.Game(config);

let prizeText, maskGraphics, scratchComplete, revealedArea;
const totalArea = 420*320;
let currentPrize = null;

const balanceEl = document.getElementById('balance');
const btnBuy = document.getElementById('btn-buy');
const btnSignin = document.getElementById('btn-signin');
const winPopup = document.getElementById('win-popup');

const STORAGE_BALANCE = 'scratch_balance';
const STORAGE_SIGNIN = 'scratch_signin_date';

// 讀取金額
let balance = parseInt(localStorage.getItem(STORAGE_BALANCE)) || 0;
updateBalance();

btnBuy.disabled = false;

function updateBalance(){
  balanceEl.textContent = `累積金額：${balance} 元`;
}

function drawPrize(prizes) {
  let rand = Math.random();
  let sum = 0;
  for(const p of prizes){
    sum += p.prob;
    if(rand <= sum) return p;
  }
  return prizes[prizes.length-1];
}

function preload(){
  // 不需外部資源
}

function create(){
  const scene = this;

  resetScratch();

  currentPrize = drawPrize(TICKETS[1].prizes);

  // 獎品文字在底層
  prizeText = scene.add.text(210, 160, currentPrize.text, {
    font: '56px Arial Black',
    fill: '#4a3800',
    stroke: '#fffbaf',
    strokeThickness: 6,
    shadow: { offsetX:3, offsetY:3, color:'#c6b96f', blur:5, fill:true }
  }).setOrigin(0.5);

  // 建立整張刮層Graphics（完整灰色遮罩）
  maskGraphics = scene.add.graphics();
  maskGraphics.fillStyle(0x999999,1);
  maskGraphics.fillRoundedRect(10,10,400,300,24);

  // Phaser 的遮罩
  let mask = maskGraphics.createGeometryMask();
  scene.children.list.forEach(child => {
    if(child !== maskGraphics) child.setMask(mask);
  });

  revealedArea = 0;
  scratchComplete = false;

  scene.input.on('pointermove', pointer => {
    if(!pointer.isDown || scratchComplete) return;

    // 每次用 eraseCircle 擦透明圓洞
    maskGraphics.eraseCircle(pointer.x, pointer.y, 25);

    revealedArea += Math.PI*25*25;
    if(revealedArea > totalArea*0.4){
      scratchComplete = true;
      showWin();
    }
  });
}

function resetScratch(){
  if(prizeText) prizeText.destroy();
  if(maskGraphics) maskGraphics.clear();
  winPopup.classList.remove('show');
  winPopup.textContent = '';
  revealedArea = 0;
  scratchComplete = false;
}

function showWin(){
  if(currentPrize.value > 0){
    balance += currentPrize.value;
    localStorage.setItem(STORAGE_BALANCE,balance);
    updateBalance();
    winPopup.textContent = `恭喜中獎：${currentPrize.text}！`;
  } else {
    winPopup.textContent = '很可惜沒中獎，再接再厲！';
  }
  winPopup.classList.add('show');
  setTimeout(()=>winPopup.classList.remove('show'),3500);
}

// 買票
btnBuy.addEventListener('click',()=>{
  if(balance < TICKETS[1].price){
    alert(`累積金額不足，買不起刮刮樂（${TICKETS[1].price}元）！`);
    return;
  }
  balance -= TICKETS[1].price;
  localStorage.setItem(STORAGE_BALANCE,balance);
  updateBalance();
  game.scene.scenes[0].scene.restart();
});

// 每日簽到
btnSignin.addEventListener('click',()=>{
  const today = new Date().toISOString().slice(0,10);
  const lastSignin = localStorage.getItem(STORAGE_SIGNIN);
  if(lastSignin === today){
    alert('今天已簽到，明天再來喔～');
    return;
  }
  balance += 500;
  localStorage.setItem(STORAGE_BALANCE,balance);
  localStorage.setItem(STORAGE_SIGNIN,today);
  updateBalance();
  alert('簽到成功！獲得500元！');
});
</script>
</body>
</html>
